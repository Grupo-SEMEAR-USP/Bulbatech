stt_node:
  ros__parameters:
    recognizer_model: "models/vosk-model-small-pt-0.3"

    device_name: "UC02"
    device_index: -1 #Anteriormente 4
    audio_frequency: 16000 #Anteriormente 48000
    debug: true
    buffer_size: 4096

    audio_vocabulary:
      - "clima"
      - "horas"
      - "bom dia"
      - "desligar"
      - "sabedoria"
      - "[unk]"
  
tts_node:
  ros__parameters:
    voice_model: "models/voiceModel/pt_BR-jeff-medium.onnx"
    voice_config: "models/voiceModel/pt_BR-jeff-medium.onnx.json"
    voice_files: "voiceFiles"